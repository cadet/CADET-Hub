# "Update workshop files" card in the JupyterLab Launcher (jupyter_app_launcher). The hub points
# JUPYTER_APP_LAUNCHER_PATH at this file's folder for workshop groups only (see projects.yaml).
- title: Update workshop files
  description: Download a fresh copy of the workshop files; archive or overwrite your current copy.
  type: terminal
  source: workshop-update
  catalog: CADET-Workshop
  # Also the icon of the section heading, which the Launcher takes from its first card
  icon: cadet-icon.svg
